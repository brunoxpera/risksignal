# RiskSignal API contract — I1b walking skeleton (ARCH-001 §4, WP-1b.07).
#
# OpenAPI 3.1, schema-first (ADR-011): this document is the source of truth
# for the /api/v1 signal reads. Server interfaces and request/response types
# are generated from it with oapi-codegen (pinned v2.8.0; see
# oapi-codegen.yml and the Makefile). The generated code is committed, and CI
# regenerates and fails on a diff (ADR-011 gate 2, wired in WP-1b.11).
#
# Locked conventions (ADR-011/ADR-008, concept ch. 3.1): JSON snake_case,
# RFC 3339 UTC date-times, string identifiers, RFC 9457 Problem Details.
# The enum vocabularies follow the domain sets (internal/domain, DEV-015):
# I4 grows SignalStatus to the full ch. 6.3 lifecycle and MatchMethod to the
# full ADR-015 set, so the read model can carry the triaged, SLA-tracked
# signals the I4 demo seed produces (ARCH-004 §8, UC-08).
#
# Deliberately outside this document (ARCH-001 §4, httpapi/system.go): the
# System endpoints GET /health/live, GET /health/ready and GET /version —
# operational probes with a fixed plain-JSON shape. Signal production is a
# CLI/operator action (demo seed|run), never an API write, so I1b declares
# no write operation; Idempotency-Key and If-Match are declared as reusable
# header-parameter components now and become operative on the I4 command
# endpoints.
openapi: 3.1.0
info:
  title: RiskSignal API
  version: 0.1.0
  description: |
    Read contract of the RiskSignal walking skeleton (I1b): the
    cursor-paginated working-list read and the single-signal read. The
    contract carries no write operations — signal production is the CLI
    `demo` path — and no System endpoints; both are deliberate (ARCH-001
    §4).
paths:
  /api/v1/signals:
    get:
      operationId: listSignals
      summary: List signals
      description: |
        Cursor-paginated, filterable working-list read (concept ch. 10.2,
        ch. 10.4). Signals sort by priority ascending (P1 first), then by
        created_at as the stable tiebreak. The page envelope always carries
        a next_cursor: pass it back unchanged to fetch the next page, null
        means the last page was reached.
      parameters:
        - name: priority
          in: query
          required: false
          description: Only signals of this priority (P1-P4).
          schema:
            $ref: '#/components/schemas/Priority'
        - name: status
          in: query
          required: false
          description: Only signals in this status. I1b signals are always "new".
          schema:
            $ref: '#/components/schemas/SignalStatus'
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous page's next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: A page of signals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalList'
        '400':
          description: |
            The request is not acceptable as given: an out-of-vocabulary
            priority or status filter, a limit outside [1, 100], a
            malformed cursor or a query value the parameter binding cannot
            parse. Rendered as an RFC 9457 problem detail whose detail
            names the offending value (ARCH-001 §4 400 mapping).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable
            database). The cause never leaves the server: the problem
            detail is the generic internal-error shape without a detail
            field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/signals/{signal_id}:
    get:
      operationId: getSignal
      summary: Get a signal
      description: |
        Readable signal detail (the exit-criterion read, ARCH-001 §4):
        the signal joined with its match, vulnerability, component and
        asset.
      parameters:
        - name: signal_id
          in: path
          required: true
          description: Signal identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The requested signal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signal'
        '400':
          description: |
            The signal_id path parameter is not a well-formed identifier
            (uuid). Rendered as an RFC 9457 problem detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No signal exists for this signal_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable
            database). The cause never leaves the server: the problem
            detail is the generic internal-error shape without a detail
            field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/signals/{signal_id}/commands:
    post:
      operationId: signalCommand
      summary: Apply one triage command to a signal
      description: |
        The I5a reference operation of the API/CLI channel-parity proof
        (ARCH-005 §8, NFR-013): one triage command on one signal. The
        authenticated identity resolved from the request context becomes the
        audit actor the use case authorises and stamps (actor_type = "user",
        actor_id = users.id); the permission gate lives inside the use case
        (signals.triage for acknowledge, signals.override for override_priority,
        deny-by-default), so a denied command writes nothing. Only these two
        commands are part of I5a; the full command surface is I5b.
      parameters:
        - name: signal_id
          in: path
          required: true
          description: Signal identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalCommandRequest'
      responses:
        '200':
          description: The signal after the command was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalCommandResult'
        '400':
          description: |
            The request is not acceptable as given: an unknown command, a
            missing/blank reason for an override, an out-of-vocabulary
            priority or an unparsable body. Rendered as an RFC 9457 problem
            detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            The authenticated principal may not exercise the command's
            permission (deny-by-default: the Administrator holds no triage or
            override right). The denied request wrote nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No signal exists for this signal_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The command conflicts with the signal's current state: a stale
            expected_version or a transition the current status does not
            allow. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/audit-events/{id}/reveal-actor:
    post:
      operationId: revealAuditEventActor
      summary: Reveal the actor identity of an audit event
      description: |
        The governed identity-reveal act of ADR-014 / ARCH-005 §7: resolve
        an audit event's user actor against the internal users table and
        return the identity. It is a fachlicher Akt, never a list-view side
        effect — the caller must hold `audit.reveal_identity` (Auditor /
        Product Owner only, never Administrator), a mandatory non-blank
        reason is required, and the resolution writes its own
        `audit.identity_revealed` audit event atomically. A non-user actor
        (system/service) has no identity to resolve and returns its own
        label. A denied or invalid request writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          description: Audit event identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealActorRequest'
      responses:
        '200':
          description: |
            The resolved identity of a user actor, or the system/service
            label of a non-user actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealedActor'
        '400':
          description: |
            The request is not acceptable as given: a malformed event id, a
            missing/blank reason or an unparsable body. Rendered as an RFC
            9457 problem detail whose detail names the offending value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            The authenticated principal may not exercise
            `audit.reveal_identity` (deny-by-default: Auditor and Product
            Owner only). The denied request wrote nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No audit event exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database
            or a failed self-audit write, which rolls the whole reveal
            back). The cause never leaves the server: the problem detail is
            the generic internal-error shape without a detail field
            (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    # --- Core signal read (ARCH-001 §4) -----------------------------------
    Signal:
      type: object
      description: One readable risk signal, joined with its asset and product.
      required:
        - id
        - match_id
        - cve_id
        - priority
        - status
        - confidence
        - method
        - product
        - summary
        - created_at
        - version
      properties:
        id:
          type: string
          description: Signal identifier (uuid).
        match_id:
          type: string
          description: Identifier of the match that produced this signal (uuid).
        cve_id:
          type: string
          description: The normalized vulnerability identifier, e.g. CVE-2024-0001.
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/SignalStatus'
        confidence:
          $ref: '#/components/schemas/Confidence'
        method:
          $ref: '#/components/schemas/MatchMethod'
        asset:
          $ref: '#/components/schemas/SignalAsset'
        product:
          $ref: '#/components/schemas/SignalProduct'
        summary:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC creation timestamp (injected clock).
        version:
          type: integer
          description: Optimistic-lock token; starts at 1 and grows on every change.
        due_at:
          type: [string, 'null']
          format: date-time
          description: RFC 3339 UTC SLA deadline; null until the I4 SLA clocks.
    SignalAsset:
      type: object
      description: The joined inventory asset of a signal (ARCH-001 §4 asset).
      required:
        - id
        - name
        - type
        - criticality
        - exposure
      properties:
        id:
          type: string
          description: Asset identifier (uuid).
        name:
          type: string
        type:
          type: string
          description: Asset type, e.g. server_vm, container_image (vocabulary grows with I3).
        criticality:
          $ref: '#/components/schemas/Criticality'
        exposure:
          $ref: '#/components/schemas/Exposure'
    SignalProduct:
      type: object
      description: The joined component product of a signal (ARCH-001 §4 product).
      required:
        - vendor
        - product
        - version
      properties:
        vendor:
          type: string
        product:
          type: string
        version:
          type: string
    SignalList:
      type: object
      description: One page of the working-list read (ARCH-001 §4 listSignals).
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          description: The signals of this page, priority ascending then created_at.
          items:
            $ref: '#/components/schemas/Signal'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page; null on the last page.
    # --- I5a reference command (ARCH-005 §8 channel parity) ---------------
    SignalCommandRequest:
      type: object
      description: |
        One triage command on one signal (the I5a reference operation of the
        API/CLI channel-parity proof). `acknowledge` moves a new signal to
        in_review; `override_priority` replaces the effective priority and
        requires a priority and a reason.
      required:
        - command
        - expected_version
      properties:
        command:
          type: string
          description: The command to apply.
          enum: [acknowledge, override_priority]
        expected_version:
          type: integer
          minimum: 1
          description: Optimistic-lock token the caller last read.
        priority:
          $ref: '#/components/schemas/Priority'
        reason:
          type: string
          description: Mandatory, non-blank justification for override_priority.
    SignalCommandResult:
      type: object
      description: The signal after a command was applied.
      required:
        - id
        - command
        - status
        - priority
        - version
      properties:
        id:
          type: string
        command:
          type: string
        status:
          $ref: '#/components/schemas/SignalStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        version:
          type: integer
          description: The optimistic-lock version after the command.

    # --- Enum vocabularies (full domain sets since I4, ARCH-001 §4) --------
    Priority:
      type: string
      description: Urgency class of a signal (concept ch. 6.2, ch. 9.3); P1 is most urgent.
      enum: [P1, P2, P3, P4]
    SignalStatus:
      type: string
      description: Lifecycle state of a signal (ch. 6.2, ch. 6.3) — new, in_review, action_planned, resolved, accepted, not_affected.
      enum: [new, in_review, action_planned, resolved, accepted, not_affected]
    Confidence:
      type: string
      description: Reliability of the vulnerability-to-component assignment, derived from the match method (ADR-015).
      enum: [high, medium, low, none]
    MatchMethod:
      type: string
      description: How the vulnerability was matched to the component (ADR-015); the full method-led set.
      enum: [exact_identifier, container_digest, alias_exact_version, canonical_product_range, product_uncertain_version, controlled_alias_only, candidate, no_match]
    Criticality:
      type: string
      description: Business criticality of the asset (concept ch. 6.2).
      enum: [critical, high, normal, low, unknown]
    Exposure:
      type: string
      description: Exposure of the asset to the internet (concept ch. 6.2).
      enum: [internet, internal, isolated, unknown]
    # --- Identity reveal (ADR-014, ARCH-005 section 7) --------------------
    RevealActorRequest:
      type: object
      description: |
        The body of the governed reveal command (ADR-014): the mandatory
        non-blank justification of the identity resolution.
      required:
        - reason
      properties:
        reason:
          type: string
          description: |
            Mandatory, non-blank justification of the resolution; recorded
            in the self-audit (concept ch. 13.2).
    RevealedActor:
      type: object
      description: |
        The outcome of a reveal. For a user actor the resolved identity
        (user_id/subject_id/display_name) is set and is_user is true; for a
        system/service actor is_user is false, label carries the actor's own
        label and the identity fields are null.
      required:
        - event_id
        - actor_type
        - is_user
        - label
      properties:
        event_id:
          type: string
          description: The revealed audit event's id (uuid).
        actor_type:
          type: string
          description: The target event's actor type (user, system or service).
        is_user:
          type: boolean
          description: Whether the target actor was a user and an identity was resolved.
        label:
          type: string
          description: |
            Display label: the resolved display name (or the "User
            #<short-id>" fallback of a pseudonymised row) for a user actor,
            or the system/service actor's own label otherwise.
        user_id:
          type: [string, 'null']
          description: The resolved internal users.id (null for a non-user actor).
        subject_id:
          type: [string, 'null']
          description: The resolved issuer-qualified external subject (null for a non-user actor).
        display_name:
          type: [string, 'null']
          description: The resolved display name (null when pseudonymised or for a non-user actor).
    # --- Error envelope (RFC 9457, ADR-011) --------------------------------
    ProblemDetails:
      type: object
      description: |
        RFC 9457 problem detail. Reusable across every API error: the 400
        of an invalid request, the 404 of an unknown signal and the generic
        500 of an unexpected internal error, all carrying the request
        correlation id (concept ch. 12.3).
      required:
        - type
        - title
        - status
        - correlation_id
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; "about:blank" when no specific type applies.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code generated by the server for this occurrence.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        correlation_id:
          type: string
          description: Request correlation id (concept ch. 12.3), linking the problem to the server logs.
  parameters:
    # Declared now, operative from the I4 command endpoints (ARCH-001 §4,
    # ADR-011): I1b declares no write operation, so no operation references
    # these two yet.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated idempotency key of a command (concept ch. 10.1).
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected optimistic-lock version of the resource, for conditional writes (concept ch. 10.1).
      schema:
        type: string
