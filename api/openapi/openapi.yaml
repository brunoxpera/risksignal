# RiskSignal API contract — I1b walking skeleton (ARCH-001 §4, WP-1b.07).
#
# OpenAPI 3.1, schema-first (ADR-011): this document is the source of truth
# for the /api/v1 signal reads. Server interfaces and request/response types
# are generated from it with oapi-codegen (pinned v2.8.0; see
# oapi-codegen.yml and the Makefile). The generated code is committed, and CI
# regenerates and fails on a diff (ADR-011 gate 2, wired in WP-1b.11).
#
# Locked conventions (ADR-011/ADR-008, concept ch. 3.1): JSON snake_case,
# RFC 3339 UTC date-times, string identifiers, RFC 9457 Problem Details.
# The enum vocabularies follow the domain sets (internal/domain, DEV-015):
# I4 grows SignalStatus to the full ch. 6.3 lifecycle and MatchMethod to the
# full ADR-015 set, so the read model can carry the triaged, SLA-tracked
# signals the I4 demo seed produces (ARCH-004 §8, UC-08).
#
# Deliberately outside this document (ARCH-001 §4, httpapi/system.go): the
# System endpoints GET /health/live, GET /health/ready and GET /version —
# operational probes with a fixed plain-JSON shape. Signal production is a
# CLI/operator action (demo seed|run), never an API write, so I1b declares
# no write operation; Idempotency-Key and If-Match are declared as reusable
# header-parameter components now and become operative on the I4 command
# endpoints.
openapi: 3.1.0
info:
  title: RiskSignal API
  version: 0.1.0
  description: |
    Read contract of the RiskSignal walking skeleton (I1b): the
    cursor-paginated working-list read and the single-signal read. The
    contract carries no write operations — signal production is the CLI
    `demo` path — and no System endpoints; both are deliberate (ARCH-001
    §4).
paths:
  /api/v1/signals:
    get:
      operationId: listSignals
      summary: List signals
      description: |
        Cursor-paginated, filterable working-list read (concept ch. 10.2,
        ch. 10.4). Signals sort by priority ascending (P1 first), then by
        created_at as the stable tiebreak. The page envelope always carries
        a next_cursor: pass it back unchanged to fetch the next page, null
        means the last page was reached.
      parameters:
        - name: priority
          in: query
          required: false
          description: Only signals of this priority (P1-P4).
          schema:
            $ref: '#/components/schemas/Priority'
        - name: status
          in: query
          required: false
          description: Only signals in this status. I1b signals are always "new".
          schema:
            $ref: '#/components/schemas/SignalStatus'
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous page's next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: A page of signals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalList'
        '400':
          description: |
            The request is not acceptable as given: an out-of-vocabulary
            priority or status filter, a limit outside [1, 100], a
            malformed cursor or a query value the parameter binding cannot
            parse. Rendered as an RFC 9457 problem detail whose detail
            names the offending value (ARCH-001 §4 400 mapping).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable
            database). The cause never leaves the server: the problem
            detail is the generic internal-error shape without a detail
            field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/signals/{signal_id}:
    get:
      operationId: getSignal
      summary: Get a signal
      description: |
        Readable signal detail (the exit-criterion read, ARCH-001 §4):
        the signal joined with its match, vulnerability, component and
        asset.
      parameters:
        - name: signal_id
          in: path
          required: true
          description: Signal identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The requested signal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signal'
        '400':
          description: |
            The signal_id path parameter is not a well-formed identifier
            (uuid). Rendered as an RFC 9457 problem detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No signal exists for this signal_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable
            database). The cause never leaves the server: the problem
            detail is the generic internal-error shape without a detail
            field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/signals/{signal_id}/commands:
    post:
      operationId: signalCommand
      summary: Apply one triage command to a signal
      description: |
        The I5a reference operation of the API/CLI channel-parity proof
        (ARCH-005 §8, NFR-013): one triage command on one signal. The
        authenticated identity resolved from the request context becomes the
        audit actor the use case authorises and stamps (actor_type = "user",
        actor_id = users.id); the permission gate lives inside the use case
        (signals.triage for acknowledge, signals.override for override_priority,
        deny-by-default), so a denied command writes nothing. Only these two
        commands are part of I5a; the full command surface is I5b.
      parameters:
        - name: signal_id
          in: path
          required: true
          description: Signal identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalCommandRequest'
      responses:
        '200':
          description: The signal after the command was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalCommandResult'
        '400':
          description: |
            The request is not acceptable as given: an unknown command, a
            missing/blank reason for an override, an out-of-vocabulary
            priority or an unparsable body. Rendered as an RFC 9457 problem
            detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            The authenticated principal may not exercise the command's
            permission (deny-by-default: the Administrator holds no triage or
            override right). The denied request wrote nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No signal exists for this signal_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The command conflicts with the signal's current state: a stale
            expected_version or a transition the current status does not
            allow. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/audit-events/{id}/reveal-actor:
    post:
      operationId: revealAuditEventActor
      summary: Reveal the actor identity of an audit event
      description: |
        The governed identity-reveal act of ADR-014 / ARCH-005 §7: resolve
        an audit event's user actor against the internal users table and
        return the identity. It is a fachlicher Akt, never a list-view side
        effect — the caller must hold `audit.reveal_identity` (Auditor /
        Product Owner only, never Administrator), a mandatory non-blank
        reason is required, and the resolution writes its own
        `audit.identity_revealed` audit event atomically. A non-user actor
        (system/service) has no identity to resolve and returns its own
        label. A denied or invalid request writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          description: Audit event identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealActorRequest'
      responses:
        '200':
          description: |
            The resolved identity of a user actor, or the system/service
            label of a non-user actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealedActor'
        '400':
          description: |
            The request is not acceptable as given: a malformed event id, a
            missing/blank reason or an unparsable body. Rendered as an RFC
            9457 problem detail whose detail names the offending value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            The authenticated principal may not exercise
            `audit.reveal_identity` (deny-by-default: Auditor and Product
            Owner only). The denied request wrote nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No audit event exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database
            or a failed self-audit write, which rolls the whole reveal
            back). The cause never leaves the server: the problem detail is
            the generic internal-error shape without a detail field
            (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/inventory/imports:
    post:
      operationId: createInventoryImport
      summary: Upload an inventory CSV for validation and preview
      description: |
        The staged inventory import, first step (ARCH-006 §2.1, concept ch.
        10.2): upload the CSV, run the validate + preview diff against the
        persisted state, persist a staged import record and return its
        import_id together with the preview tallies and the positioned
        error/warning report. Nothing is written to the inventory — the
        staged record is committed by POST /inventory/imports/{id}/commit.
        The upload is bounded by the configured InventoryMaxBytes; an
        oversized body is a 413. Requires `inventory.manage`.
      requestBody:
        required: true
        description: The inventory CSV (bounded by InventoryMaxBytes).
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: |
            The staged import record: its import_id, the preview tallies and
            the positioned error/warning report. The import is not yet
            committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImport'
        '400':
          description: |
            The request is not acceptable as given: an unreadable CSV or a
            body the binding cannot read. Rendered as an RFC 9457 problem
            detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            The authenticated principal may not exercise `inventory.manage`
            (deny-by-default). The denied request wrote nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: |
            The uploaded CSV exceeds InventoryMaxBytes; the parse is rejected
            before any record is staged. Rendered as an RFC 9457 problem
            detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/inventory/imports/{id}:
    get:
      operationId: getInventoryImport
      summary: Read a staged inventory import
      description: |
        Return the stored staged import's status, preview tallies and
        error/warning counts (ARCH-006 §2.1). Requires `inventory.manage`.
      parameters:
        - name: id
          in: path
          required: true
          description: Import record identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The stored staged import record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImport'
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `inventory.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No staged import exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/inventory/imports/{id}/commit:
    post:
      operationId: commitInventoryImport
      summary: Commit a staged inventory import
      description: |
        Load the stored bytes of a staged import and run the existing I3
        CommitInventory command (one transaction, audited, enqueues one
        matching.rebuild on change), then mark the record committed
        (ARCH-006 §2.1). Re-committing an already-committed record is a no-op
        returning the stored result (idempotent). Requires `inventory.manage`.
      parameters:
        - name: id
          in: path
          required: true
          description: Import record identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: |
            The import record after the commit (status committed, committed_at
            set) with its result tallies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImport'
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `inventory.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No staged import exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The commit conflicts with the record's state (for example a
            failed import). Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database or
            a failed matching.rebuild enqueue, which rolls the whole commit
            back). The cause never leaves the server: the problem detail is
            the generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: List inventory assets
      description: |
        Cursor-paginated, filterable asset read (ARCH-006 §2.2, concept ch.
        10.4). Assets sort stably; the page envelope always carries a
        next_cursor (null on the last page). Object scope injects
        owner_id = principal.id for the assigned case. Requires
        `inventory.read`.
      parameters:
        - name: type
          in: query
          required: false
          description: Only assets of this type.
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: environment
          in: query
          required: false
          description: Only assets in this environment.
          schema:
            $ref: '#/components/schemas/Environment'
        - name: criticality
          in: query
          required: false
          description: Only assets of this criticality.
          schema:
            $ref: '#/components/schemas/Criticality'
        - name: exposure
          in: query
          required: false
          description: Only assets with this exposure.
          schema:
            $ref: '#/components/schemas/Exposure'
        - name: owner_id
          in: query
          required: false
          description: Only assets owned by this principal id.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Only assets whose import source is this source.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous page's next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: A page of assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
        '400':
          description: |
            The request is not acceptable as given: an out-of-vocabulary
            filter, a limit outside [1, 100] or a malformed cursor. Rendered
            as an RFC 9457 problem detail whose detail names the offending
            value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `inventory.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/assets/{id}/components:
    get:
      operationId: getAssetComponents
      summary: Read one asset and its components
      description: |
        The asset detail read (ARCH-006 §2.2): one asset together with its
        components; also reused by the signal-detail asset context. Requires
        `inventory.read`.
      parameters:
        - name: id
          in: path
          required: true
          description: Asset identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The asset and its components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetComponents'
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `inventory.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No asset exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List internal users
      description: |
        The user/role administration read (ARCH-006 §3.3, concept ch. 10.2):
        a cursor-paginated list of internal users with their current roles.
        Requires `users.roles.manage`.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum page size.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous page's next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          description: A limit outside [1, 100] or a malformed cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `users.roles.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error (for example an unreachable database).
            The cause never leaves the server: the problem detail is the
            generic internal-error shape without a detail field (concept
            ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List the role vocabulary
      description: |
        The role catalogue (ARCH-006 §3.3, ARCH-005 §1): the fixed five-role
        vocabulary from code, each with its permission→scope grants. Requires
        `users.roles.manage`.
      responses:
        '200':
          description: The role vocabulary with its permission grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '403':
          description: The authenticated principal may not exercise `users.roles.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server:
            the problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/users/{id}/roles:
    patch:
      operationId: updateUserRoles
      summary: Grant and/or revoke a user's roles
      description: |
        The role-administration write (ARCH-006 §3.3, ARCH-005 §1): grant
        and/or revoke roles on one user, writing a `users.role_granted` /
        `users.role_revoked` audit event per change (concept ch. 13.2).
        Requires `users.roles.manage`.
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: The user with its roles after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            The request is not acceptable as given: a malformed user id, an
            out-of-vocabulary role or an unparsable body. Rendered as an RFC
            9457 problem detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `users.roles.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No user exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The change conflicts with the user's state (for example a role
            change on a deactivated user). Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server:
            the problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      summary: Deactivate a user
      description: |
        Deactivate-never-delete (ARCH-006 §3.3, ADR-014): stamp the user's
        deactivation instant; the internal id stays permanently referenceable
        so the audit trail stays resolvable. Requires `users.roles.manage`.
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The user after deactivation (deactivated_at set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `users.roles.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No user exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The user is already deactivated (the guarded transition did not
            apply). Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server:
            the problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # --- I6 exports (ARCH-007 §1.1) ----------------------------------------
  /api/v1/exports:
    post:
      operationId: createExport
      summary: Create an asynchronous export job
      description: |
        Create an export (ARCH-007 §1.1): the body freezes the signal filter
        context and the requested format; a worker job then materialises the
        artifact. The frozen filter, creation instant and the schema/rule
        versions are stamped on the record; the artifact is time-limited and
        every download is audited. Requires `exports.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequest'
      responses:
        '200':
          description: The created export record (status pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRecord'
        '400':
          description: |
            The request is not acceptable as given: a missing format, an
            out-of-vocabulary value in the frozen filter or a filter whose
            complexity exceeds the bound. Rendered as an RFC 9457 problem
            detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `exports.create`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/exports/{id}:
    get:
      operationId: getExport
      summary: Get an export record
      description: |
        The status read of one export (ARCH-007 §1.1): status, frozen filter,
        creation instant, row/size counts, checksum, the stamped schema/rule
        versions and the expiry. Object-scoped to the creator for a scoped
        grant. Requires `exports.create`.
      parameters:
        - name: id
          in: path
          required: true
          description: Export identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The requested export record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRecord'
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `exports.create`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No export exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/exports/{id}/download:
    get:
      operationId: downloadExport
      summary: Download the materialised export artifact
      description: |
        Stream the stored artifact as an attachment (ARCH-007 §1.1). The
        download is time-limited — an expired export answers 410 — and every
        download is audited. Requires `exports.create`.
      parameters:
        - name: id
          in: path
          required: true
          description: Export identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The export artifact as a file download.
          headers:
            Content-Disposition:
              description: Attachment filename of the artifact.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `exports.create`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No export exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The export exists but is not completed yet (status pending or
            failed), so there is no artifact to stream. Nothing was streamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: |
            The export artifact has expired (checked against the injected
            clock, NFR-015) and is no longer downloadable. Nothing is streamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # --- I6 retention runs (ARCH-007 §2.1/§2.2) ----------------------------
  /api/v1/retention/runs:
    post:
      operationId: createRetentionRun
      summary: Propose a retention dry-run
      description: |
        Run a retention dry-run (ARCH-007 §2.2 step 1): scan the closed
        signals due at the cutoff, count the actionable and held candidates
        and store a counts-only `retention_runs` row (`status='dry_run'`). A
        dry-run changes nothing (reads only, no audit row) — it is the
        mandatory proposal the four-eyes approval acts on. Requires
        `retention.manage`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionDryRunRequest'
      responses:
        '200':
          description: The stored dry-run report (status dry_run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRun'
        '400':
          description: |
            The request is not acceptable as given (an unknown stage).
            Rendered as an RFC 9457 problem detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `retention.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: listRetentionRuns
      summary: List the retention-run report
      description: |
        The retention-run report (ARCH-007 §2.2 step 4): every stored run
        with its counts-only dry-run report, its four-eyes approval and its
        final counts. The rows survive the deletion they report on. Requires
        `retention.manage`.
      responses:
        '200':
          description: One page of the retention-run report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRunList'
        '403':
          description: The authenticated principal may not exercise `retention.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/retention/runs/{id}:
    get:
      operationId: getRetentionRun
      summary: Get one retention run
      description: |
        The status read of one retention run (ARCH-007 §2.2): its counts-only
        dry-run report, its four-eyes approval and its final counts. Requires
        `retention.manage`.
      parameters:
        - name: id
          in: path
          required: true
          description: Retention run identifier (uuid).
          schema:
            type: string
      responses:
        '200':
          description: The requested retention run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRun'
        '400':
          description: The id path parameter is not a well-formed identifier (uuid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `retention.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No retention run exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/retention/runs/{id}/approve:
    post:
      operationId: approveRetentionRun
      summary: Approve (or reject) a retention dry-run
      description: |
        The four-eyes approval of a stored dry-run (ARCH-007 §2.2 step 2): the
        Product Owner reviews the report and decides with a mandatory reason,
        flipping the run `dry_run → approved` (or `→ rejected`). Only an
        approved run may be executed, and the approval enqueues exactly one
        `retention.execute` job. Requires `settings.approve`.
      parameters:
        - name: id
          in: path
          required: true
          description: Retention run identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionApproveRequest'
      responses:
        '200':
          description: The approved (or rejected) retention run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRun'
        '400':
          description: |
            The request is not acceptable as given (a missing/blank reason).
            Rendered as an RFC 9457 problem detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `settings.approve`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No retention run exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The run is not in the `dry_run` state (already decided), so the
            decision conflicts with the current state. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # --- I6 legal holds (ARCH-007 §2.1) ------------------------------------
  /api/v1/legal-holds:
    post:
      operationId: createLegalHold
      summary: Set a documented legal hold
      description: |
        Set one documented legal hold (ARCH-007 §2.1, §13.4 step 2): an active
        hold blocks both the deletion and the pseudonymisation of its
        aggregate and preserves the original record as-is. The mandatory
        reason is the audit record. Requires `retention.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldCreateRequest'
      responses:
        '200':
          description: The stored (active) legal hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'
        '400':
          description: |
            The request is not acceptable as given (a missing aggregate id or
            a blank reason). Rendered as an RFC 9457 problem detail; nothing
            was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `retention.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: listLegalHolds
      summary: List the legal holds
      description: |
        The legal-hold read (ARCH-007 §2.1): every hold matching the filter,
        ordered by creation instant. Requires `retention.manage`.
      responses:
        '200':
          description: One page of the legal-hold read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldList'
        '403':
          description: The authenticated principal may not exercise `retention.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/legal-holds/{id}/release:
    post:
      operationId: releaseLegalHold
      summary: Release a legal hold
      description: |
        Release one hold by its id (ARCH-007 §2.1): the release is set-once,
        takes a mandatory reason and is audited. A released hold no longer
        blocks its aggregate. Requires `retention.manage`.
      parameters:
        - name: id
          in: path
          required: true
          description: Legal hold identifier (uuid).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldReleaseRequest'
      responses:
        '200':
          description: The released legal hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'
        '400':
          description: |
            The request is not acceptable as given (a blank reason). Rendered
            as an RFC 9457 problem detail; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The authenticated principal may not exercise `retention.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No legal hold exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: |
            The hold is already released (the release is set-once), so the
            request conflicts with the current state. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Unexpected internal error. The cause never leaves the server: the
            problem detail is the generic internal-error shape without a
            detail field (concept ch. 5.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    # --- Core signal read (ARCH-001 §4) -----------------------------------
    Signal:
      type: object
      description: One readable risk signal, joined with its asset and product.
      required:
        - id
        - match_id
        - cve_id
        - priority
        - status
        - confidence
        - method
        - product
        - summary
        - created_at
        - version
      properties:
        id:
          type: string
          description: Signal identifier (uuid).
        match_id:
          type: string
          description: Identifier of the match that produced this signal (uuid).
        cve_id:
          type: string
          description: The normalized vulnerability identifier, e.g. CVE-2024-0001.
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/SignalStatus'
        confidence:
          $ref: '#/components/schemas/Confidence'
        method:
          $ref: '#/components/schemas/MatchMethod'
        asset:
          $ref: '#/components/schemas/SignalAsset'
        product:
          $ref: '#/components/schemas/SignalProduct'
        summary:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC creation timestamp (injected clock).
        version:
          type: integer
          description: Optimistic-lock token; starts at 1 and grows on every change.
        due_at:
          type: [string, 'null']
          format: date-time
          description: RFC 3339 UTC SLA deadline; null until the I4 SLA clocks.
    SignalAsset:
      type: object
      description: The joined inventory asset of a signal (ARCH-001 §4 asset).
      required:
        - id
        - name
        - type
        - criticality
        - exposure
      properties:
        id:
          type: string
          description: Asset identifier (uuid).
        name:
          type: string
        type:
          type: string
          description: Asset type, e.g. server_vm, container_image (vocabulary grows with I3).
        criticality:
          $ref: '#/components/schemas/Criticality'
        exposure:
          $ref: '#/components/schemas/Exposure'
    SignalProduct:
      type: object
      description: The joined component product of a signal (ARCH-001 §4 product).
      required:
        - vendor
        - product
        - version
      properties:
        vendor:
          type: string
        product:
          type: string
        version:
          type: string
    SignalList:
      type: object
      description: One page of the working-list read (ARCH-001 §4 listSignals).
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          description: The signals of this page, priority ascending then created_at.
          items:
            $ref: '#/components/schemas/Signal'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page; null on the last page.
    # --- Signal command surface (ARCH-006 §1.2: eight explicit commands) --
    SignalCommandRequest:
      type: object
      description: |
        One explicit triage command on one signal — the full I5b command
        surface (ARCH-006 §1.2, concept ch. 10.3). The `command` property is
        the discriminator: it selects which of the eight commands is applied
        and therefore which fields are required. The command is never an
        object patch — every value is an explicit input, never an implicit
        default.

        Required fields per command:
          - acknowledge:       expected_version
          - change_status:     status, expected_version
          - assign_owner:      owner_id ("" clears), expected_version
          - add_comment:       comment
          - override_priority: priority, reason, expected_version
          - revert_priority:   expected_version
          - pause_sla:         target, reason
          - resume_sla:        target, reason

        `expected_version` is the optimistic-lock token, mandatory only on the
        five version-guarded commands (acknowledge, change_status,
        assign_owner, override_priority, revert_priority); comments append and
        SLA pause/resume are guarded by clock state, not a row version
        (ARCH-006 §1.2). `reason` is mandatory for override_priority and
        pause_sla/resume_sla and for the guarded change_status edges
        (closed-entry / reopen); the domain enforces those residual rules.
      required:
        - command
      properties:
        command:
          type: string
          description: The command to apply (the discriminator of the request).
          enum:
            - acknowledge
            - change_status
            - assign_owner
            - add_comment
            - override_priority
            - revert_priority
            - pause_sla
            - resume_sla
        expected_version:
          type: integer
          minimum: 1
          description: Optimistic-lock token the caller last read (version-guarded commands only).
        status:
          $ref: '#/components/schemas/SignalStatus'
        reason:
          type: string
          description: Non-blank justification; mandatory per command (override_priority, pause_sla, resume_sla, guarded change_status).
        owner_id:
          type: string
          description: Owner principal id (assign_owner); the empty string clears the assignment.
        comment:
          type: string
          description: Append-only comment body (add_comment).
        priority:
          $ref: '#/components/schemas/Priority'
        target:
          $ref: '#/components/schemas/SLATarget'
      allOf:
        - if:
            properties:
              command:
                const: acknowledge
            required: [command]
          then:
            required: [expected_version]
        - if:
            properties:
              command:
                const: change_status
            required: [command]
          then:
            required: [expected_version, status]
        - if:
            properties:
              command:
                const: assign_owner
            required: [command]
          then:
            required: [expected_version, owner_id]
        - if:
            properties:
              command:
                const: add_comment
            required: [command]
          then:
            required: [comment]
        - if:
            properties:
              command:
                const: override_priority
            required: [command]
          then:
            required: [expected_version, priority, reason]
        - if:
            properties:
              command:
                const: revert_priority
            required: [command]
          then:
            required: [expected_version]
        - if:
            properties:
              command:
                const: pause_sla
            required: [command]
          then:
            required: [target, reason]
        - if:
            properties:
              command:
                const: resume_sla
            required: [command]
          then:
            required: [target, reason]
    SignalCommandResult:
      type: object
      description: |
        The signal after a command was applied. `status`/`priority`/`version`
        always carry the post-command state; the nullable detail fields carry
        the command-specific outcome — `owner_id` for assign_owner, `target`
        for pause_sla/resume_sla and `auto_priority` for override_priority /
        revert_priority (null when the command does not apply to the field).
      required:
        - id
        - command
        - status
        - priority
        - version
        - owner_id
        - target
        - auto_priority
      properties:
        id:
          type: string
        command:
          type: string
        status:
          $ref: '#/components/schemas/SignalStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        version:
          type: integer
          description: The optimistic-lock version after the command.
        owner_id:
          type: [string, 'null']
          description: The owner principal after assign_owner; null for the other commands.
        target:
          oneOf:
            - $ref: '#/components/schemas/SLATarget'
            - type: 'null'
          description: The SLA target after pause_sla/resume_sla; null for the other commands.
        auto_priority:
          oneOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
          description: The computed priority preserved by override_priority; null for the other commands.

    # --- Enum vocabularies (full domain sets since I4, ARCH-001 §4) --------
    Priority:
      type: string
      description: Urgency class of a signal (concept ch. 6.2, ch. 9.3); P1 is most urgent.
      enum: [P1, P2, P3, P4]
    SignalStatus:
      type: string
      description: Lifecycle state of a signal (ch. 6.2, ch. 6.3) — new, in_review, action_planned, resolved, accepted, not_affected.
      enum: [new, in_review, action_planned, resolved, accepted, not_affected]
    Confidence:
      type: string
      description: Reliability of the vulnerability-to-component assignment, derived from the match method (ADR-015).
      enum: [high, medium, low, none]
    MatchMethod:
      type: string
      description: How the vulnerability was matched to the component (ADR-015); the full method-led set.
      enum: [exact_identifier, container_digest, alias_exact_version, canonical_product_range, product_uncertain_version, controlled_alias_only, candidate, no_match]
    Criticality:
      type: string
      description: Business criticality of the asset (concept ch. 6.2).
      enum: [critical, high, normal, low, unknown]
    Exposure:
      type: string
      description: Exposure of the asset to the internet (concept ch. 6.2).
      enum: [internet, internal, isolated, unknown]
    SLATarget:
      type: string
      description: Reaction-time target of a signal (ch. 6.3, ARCH-004 §4.1).
      enum: [notification, acknowledgement, assessment, decision]
    # --- Identity reveal (ADR-014, ARCH-005 section 7) --------------------
    RevealActorRequest:
      type: object
      description: |
        The body of the governed reveal command (ADR-014): the mandatory
        non-blank justification of the identity resolution.
      required:
        - reason
      properties:
        reason:
          type: string
          description: |
            Mandatory, non-blank justification of the resolution; recorded
            in the self-audit (concept ch. 13.2).
    RevealedActor:
      type: object
      description: |
        The outcome of a reveal. For a user actor the resolved identity
        (user_id/subject_id/display_name) is set and is_user is true; for a
        system/service actor is_user is false, label carries the actor's own
        label and the identity fields are null.
      required:
        - event_id
        - actor_type
        - is_user
        - label
      properties:
        event_id:
          type: string
          description: The revealed audit event's id (uuid).
        actor_type:
          type: string
          description: The target event's actor type (user, system or service).
        is_user:
          type: boolean
          description: Whether the target actor was a user and an identity was resolved.
        label:
          type: string
          description: |
            Display label: the resolved display name (or the "User
            #<short-id>" fallback of a pseudonymised row) for a user actor,
            or the system/service actor's own label otherwise.
        user_id:
          type: [string, 'null']
          description: The resolved internal users.id (null for a non-user actor).
        subject_id:
          type: [string, 'null']
          description: The resolved issuer-qualified external subject (null for a non-user actor).
        display_name:
          type: [string, 'null']
          description: The resolved display name (null when pseudonymised or for a non-user actor).
    # --- I5b inventory import resources (ARCH-006 §2.1) --------------------
    InventoryImportStatus:
      type: string
      description: Lifecycle of a staged import record (ARCH-006 §2.1).
      enum: [pending, committed, failed]
    InventoryImportPreview:
      type: object
      description: |
        The validate + preview tallies of one staged import (ARCH-006 §2.1):
        the readable row count, the positioned error/warning counts and the
        created/updated/unchanged tallies a commit of the clean rows would
        produce.
      required:
        - rows
        - errors
        - warnings
        - assets_created
        - assets_updated
        - assets_unchanged
        - components_created
        - components_updated
        - components_unchanged
      properties:
        rows:
          type: integer
          description: Readable data rows of the CSV.
        errors:
          type: integer
          description: Positions that failed validation.
        warnings:
          type: integer
          description: Data-quality warnings (unknown criticality/exposure).
        assets_created:
          type: integer
        assets_updated:
          type: integer
        assets_unchanged:
          type: integer
        components_created:
          type: integer
        components_updated:
          type: integer
        components_unchanged:
          type: integer
    InventoryImportProblem:
      type: object
      description: |
        One positioned validation failure of an inventory CSV (ARCH-003 §1.3):
        the 1-based physical line, the offending column name ("" for a
        row/header-spanning problem), the human-readable reason and the
        offending cell verbatim ("" when no single cell is at fault).
      required:
        - line
        - column
        - reason
        - input
      properties:
        line:
          type: integer
        column:
          type: string
        reason:
          type: string
        input:
          type: string
    InventoryImportWarning:
      type: object
      description: |
        One data-quality warning of an inventory CSV (ARCH-003 §1.3): the
        first contributing data line, the field, the unknown value and the
        reason.
      required:
        - line
        - field
        - value
        - reason
      properties:
        line:
          type: integer
        field:
          type: string
        value:
          type: string
        reason:
          type: string
    InventoryImport:
      type: object
      description: |
        One staged inventory import record (ARCH-006 §2.1): its id and status,
        the creation and (nullable) commit instants, the preview tallies and
        the positioned error/warning report.
      required:
        - id
        - status
        - created_at
        - committed_at
        - preview
        - problems
        - warnings
      properties:
        id:
          type: string
          description: Staged import identifier (uuid).
        status:
          $ref: '#/components/schemas/InventoryImportStatus'
        created_at:
          type: string
          format: date-time
        committed_at:
          type: [string, 'null']
          format: date-time
          description: Commit instant (null until committed).
        preview:
          $ref: '#/components/schemas/InventoryImportPreview'
        problems:
          type: array
          description: The positioned validation errors of the upload.
          items:
            $ref: '#/components/schemas/InventoryImportProblem'
        warnings:
          type: array
          description: The data-quality warnings of the upload.
          items:
            $ref: '#/components/schemas/InventoryImportWarning'
    # --- I5b assets read resources (ARCH-006 §2.2) ------------------------
    AssetType:
      type: string
      description: Inventory asset type (ch. 6.2); the vocabulary grows by migration and API versioning.
      enum: [server_vm, application_framework, container_image, network_security, cloud_saas]
    Environment:
      type: string
      description: Runtime environment of an asset (ch. 6.2); visible context only, never a priority driver.
      enum: [production, staging, test, development, unknown]
    VersionScheme:
      type: string
      description: Version-ordering scheme of a component, inferred at import time (ARCH-003 §2).
      enum: [semver, debian, rpm, maven, calver, generic, unknown]
    Asset:
      type: object
      description: |
        One inventoried asset (ARCH-003 §1.1): its import identity (source,
        external_id), the human name, the classification vocabularies, the
        owner and its lifecycle flags (deactivate-never-delete).
      required:
        - id
        - external_id
        - source
        - type
        - name
        - environment
        - criticality
        - exposure
        - owner
        - deactivated
        - verified
      properties:
        id:
          type: string
          description: Asset identifier (uuid).
        external_id:
          type: string
          description: Import idempotency key half; unique with source.
        source:
          type: string
        type:
          $ref: '#/components/schemas/AssetType'
        name:
          type: string
        environment:
          $ref: '#/components/schemas/Environment'
        criticality:
          $ref: '#/components/schemas/Criticality'
        exposure:
          $ref: '#/components/schemas/Exposure'
        owner:
          type: [string, 'null']
          description: Owner principal id; null when unassigned.
        deactivated:
          type: boolean
        verified:
          type: boolean
          description: Last manual data-quality verification; informational.
    AssetList:
      type: object
      description: One page of the asset read (ARCH-006 §2.2).
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page; null on the last page.
    Component:
      type: object
      description: |
        One inventoried component of an asset (ARCH-003 §1.2): the raw
        identifiers verbatim ("" when absent), the inferred version scheme
        and the lifecycle flag.
      required:
        - id
        - asset_id
        - vendor
        - product
        - version
        - cpe
        - purl
        - image
        - digest
        - version_scheme
        - deactivated
      properties:
        id:
          type: string
        asset_id:
          type: string
        vendor:
          type: string
        product:
          type: string
        version:
          type: string
        cpe:
          type: string
        purl:
          type: string
        image:
          type: string
        digest:
          type: string
        version_scheme:
          $ref: '#/components/schemas/VersionScheme'
        deactivated:
          type: boolean
    AssetComponents:
      type: object
      description: |
        One asset together with its components — the GET
        /assets/{id}/components read (ARCH-006 §2.2), also reused by the
        signal-detail asset context.
      required:
        - asset
        - components
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
    # --- I5b user/role administration (ARCH-006 §3.3) ---------------------
    Role:
      type: string
      description: Internal authorisation role (ARCH-005 §1/§3); the fixed five-role vocabulary from code.
      enum: [security_analyst, system_responsible, administrator, auditor, product_owner]
    Scope:
      type: string
      description: Object scope of a permission grant (ARCH-005 §3).
      enum: [all, own, assigned]
    PermissionGrant:
      type: object
      description: One permission→scope grant of a role (ARCH-005 §3 matrix).
      required:
        - permission
        - scope
      properties:
        permission:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
    RoleDescriptor:
      type: object
      description: One role of the catalogue with its permission grants (ARCH-005 §1/§3, ARCH-006 §3.3).
      required:
        - role
        - permissions
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
    RoleList:
      type: object
      description: The complete role catalogue (ARCH-006 §3.3).
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoleDescriptor'
    User:
      type: object
      description: |
        One internal user with its current roles (ARCH-005 §1, ARCH-006
        §3.3). Users are deactivated, never deleted (ADR-014); email is an
        optional notification recipient and never the login key.
      required:
        - id
        - subject_id
        - display_name
        - email
        - roles
        - deactivated_at
        - last_login_at
        - created_at
      properties:
        id:
          type: string
          description: Stable internal users.id (uuid) — the audit actor id for user actors.
        subject_id:
          type: string
          description: Issuer-qualified external OIDC subject ("<issuer>::<sub>").
        display_name:
          type: string
        email:
          type: [string, 'null']
          description: Optional e-mail (notification recipient only).
        roles:
          type: array
          description: The user's current roles; empty means deny-by-default.
          items:
            $ref: '#/components/schemas/Role'
        deactivated_at:
          type: [string, 'null']
          format: date-time
          description: Deactivation instant (null = active).
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    UserList:
      type: object
      description: One page of the user read (ARCH-006 §3.3).
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page; null on the last page.
    UpdateUserRolesRequest:
      type: object
      description: |
        The role-administration write (ARCH-006 §3.3, ARCH-005 §1): grant
        and/or revoke roles on one user. Each change writes its own
        `users.role_granted` / `users.role_revoked` audit event.
      required:
        - grant
        - revoke
      properties:
        grant:
          type: array
          description: Roles to grant.
          items:
            $ref: '#/components/schemas/Role'
        revoke:
          type: array
          description: Roles to revoke.
          items:
            $ref: '#/components/schemas/Role'
    # --- I6 exports (ARCH-007 §1.2) ---------------------------------------
    ExportFormat:
      type: string
      description: Serialisation format of an export artifact (ARCH-007 §1.1).
      enum: [csv, json]
    ExportStatus:
      type: string
      description: Lifecycle of an export job (ARCH-007 §1.1).
      enum: [pending, completed, failed, expired]
    ExportFilter:
      type: object
      description: |
        The frozen signal filter context of an export (ARCH-007 §1.2, the
        concept ch. 10.4 signal filter vocabulary: priority, status, asset_id,
        asset_type, product, cve, owner_id, source_id, created_from/to,
        sla_state, free_text). Every property is optional; an empty object is
        the unfiltered working list. The frozen filter is part of the export
        record and never changes after creation.
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/SignalStatus'
        asset_id:
          type: string
        asset_type:
          $ref: '#/components/schemas/AssetType'
        product:
          type: string
        cve:
          type: string
        owner_id:
          type: string
        source_id:
          type: string
        created_from:
          type: string
          format: date-time
        created_to:
          type: string
          format: date-time
        sla_state:
          type: string
          description: SLA state filter value; the domain enforces its vocabulary.
        free_text:
          type: string
    ExportCreateRequest:
      type: object
      description: |
        The body of POST /exports (ARCH-007 §1.1): the frozen filter context
        and the requested format.
      required:
        - filter
        - format
      properties:
        filter:
          $ref: '#/components/schemas/ExportFilter'
        format:
          $ref: '#/components/schemas/ExportFormat'
    ExportRecord:
      type: object
      description: |
        One export job (ARCH-007 §1.1). The frozen filter and created_at are
        fixed at creation; row_count/size_bytes/checksum/schema_version/
        rule_version/expires_at are stamped when the worker job completes
        (null while pending, failed or expired).
      required:
        - id
        - status
        - filter
        - created_at
        - row_count
        - size_bytes
        - checksum
        - schema_version
        - rule_version
        - expires_at
      properties:
        id:
          type: string
          description: Export identifier (uuid).
        status:
          $ref: '#/components/schemas/ExportStatus'
        filter:
          $ref: '#/components/schemas/ExportFilter'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC creation instant (injected clock).
        row_count:
          type: [integer, 'null']
          description: Materialised row count; null until completed.
        size_bytes:
          type: [integer, 'null']
          description: Artifact size in bytes; null until completed.
        checksum:
          type: [string, 'null']
          description: SHA-256 of the artifact; null until completed.
        schema_version:
          type: [string, 'null']
          description: Export schema version stamped at generation; null until completed.
        rule_version:
          type: [string, 'null']
          description: Priority-rule version at generation time; null until completed.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: RFC 3339 UTC expiry of the artifact; null until completed.
    # --- I6 retention + legal holds (ARCH-007 §2.1/§2.2) ------------------
    RetentionStage:
      type: string
      description: Retention stage of a run (ARCH-007 §2.1); "pseudonymise" runs before "delete".
      enum: [pseudonymise, delete]
    RetentionRunStatus:
      type: string
      description: |
        Lifecycle of a retention run (ARCH-007 §2.2): dry_run → approved →
        executing → completed, plus failed/rejected. Only an approved run may
        be executed; a rejected run is terminal.
      enum: [dry_run, approved, executing, completed, failed, rejected]
    RetentionDryRunReport:
      type: object
      description: |
        The counts-only outcome of a retention dry-run (ARCH-007 §2.1): how
        many candidates were found, how many are held, and how many would be
        pseudonymised/deleted. It carries no business content.
      required:
        - candidates
        - held
        - to_pseudonymise
        - to_delete
      properties:
        candidates:
          type: integer
        held:
          type: integer
        to_pseudonymise:
          type: integer
        to_delete:
          type: integer
    RetentionDryRunRequest:
      type: object
      description: |
        The body of a retention dry-run (ARCH-007 §2.2): the policy, stage and
        cutoff to propose. All properties are optional — the configured policy
        defaults apply.
      properties:
        policy_id:
          type: string
        stage:
          $ref: '#/components/schemas/RetentionStage'
        cutoff:
          type: string
          format: date-time
    RetentionApproveRequest:
      type: object
      description: |
        The body of a retention approval (ARCH-007 §2.2): the mandatory
        non-blank reason. Approval is the four-eyes half (permission
        `settings.approve`, Product Owner); no deletion runs without an
        approved run.
      required:
        - reason
      properties:
        reason:
          type: string
    RetentionExecuteRequest:
      type: object
      description: |
        The body of a retention execution request (ARCH-007 §2.2): the
        approved run to claim and the partition to process.
      required:
        - run_id
      properties:
        run_id:
          type: string
          description: The approved retention_runs.id to execute (uuid).
        partition_key:
          type: string
          description: The partition to process; empty processes all approved partitions.
    RetentionRun:
      type: object
      description: |
        One retention run (ARCH-007 §2.1) — the operational record that
        survives deletion. It carries counts and time ranges only, never
        business content.
      required:
        - id
        - policy_id
        - stage
        - cutoff
        - partition_key
        - status
        - dry_run
        - approved_by
        - approved_at
        - approval_reason
        - started_at
        - finished_at
        - pseudonymised_count
        - deleted_count
        - failed_count
        - last_error
      properties:
        id:
          type: string
          description: Retention run identifier (uuid).
        policy_id:
          type: string
          description: Retention policy id, e.g. "closed-signals-5y".
        stage:
          $ref: '#/components/schemas/RetentionStage'
        cutoff:
          type: string
          format: date-time
          description: RFC 3339 UTC cutoff (closed_at <= cutoff is due).
        partition_key:
          type: string
        status:
          $ref: '#/components/schemas/RetentionRunStatus'
        dry_run:
          oneOf:
            - $ref: '#/components/schemas/RetentionDryRunReport'
            - type: 'null'
          description: The dry-run counts; null until a dry-run is recorded.
        approved_by:
          type: [string, 'null']
          description: Approving principal id; null until approved.
        approved_at:
          type: [string, 'null']
          format: date-time
        approval_reason:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        pseudonymised_count:
          type: integer
        deleted_count:
          type: integer
        failed_count:
          type: integer
        last_error:
          type: [string, 'null']
    RetentionRunList:
      type: object
      description: One page of the retention-run report (ARCH-007 §2.2).
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RetentionRun'
        next_cursor:
          type: [string, 'null']
    LegalHold:
      type: object
      description: |
        One documented legal hold (ARCH-007 §2.1): it blocks both deletion and
        pseudonymisation of the aggregate until released. Setting/releasing a
        hold is audited.
      required:
        - id
        - aggregate_type
        - aggregate_id
        - reason
        - actor_id
        - created_at
        - released_at
      properties:
        id:
          type: string
          description: Legal hold identifier (uuid).
        aggregate_type:
          type: string
          description: Type of the held aggregate; defaults to "risk_signal".
        aggregate_id:
          type: string
          description: Identifier of the held aggregate (uuid).
        reason:
          type: string
          description: Documented hold reason (mandatory, non-blank).
        actor_id:
          type: string
          description: Principal id that set the hold.
        created_at:
          type: string
          format: date-time
        released_at:
          type: [string, 'null']
          format: date-time
          description: Release instant; null while the hold is active.
    LegalHoldList:
      type: object
      description: One page of the legal-hold read (ARCH-007 §2.1).
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalHold'
        next_cursor:
          type: [string, 'null']
    LegalHoldCreateRequest:
      type: object
      description: |
        The body of a legal-hold creation (ARCH-007 §2.1): the aggregate to
        hold and the mandatory documented reason.
      required:
        - aggregate_id
        - reason
      properties:
        aggregate_type:
          type: string
          description: Aggregate type; defaults to "risk_signal" when omitted.
        aggregate_id:
          type: string
          description: Identifier of the aggregate to hold (uuid).
        reason:
          type: string
          description: Documented hold reason (mandatory, non-blank).
    LegalHoldReleaseRequest:
      type: object
      description: |
        The body of a legal-hold release (ARCH-007 §2.1): the mandatory
        released reason.
      required:
        - reason
      properties:
        reason:
          type: string
    # --- Error envelope (RFC 9457, ADR-011) --------------------------------
    ProblemDetails:
      type: object
      description: |
        RFC 9457 problem detail. Reusable across every API error: the 400
        of an invalid request, the 404 of an unknown signal and the generic
        500 of an unexpected internal error, all carrying the request
        correlation id (concept ch. 12.3).
      required:
        - type
        - title
        - status
        - correlation_id
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; "about:blank" when no specific type applies.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code generated by the server for this occurrence.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
        correlation_id:
          type: string
          description: Request correlation id (concept ch. 12.3), linking the problem to the server logs.
  parameters:
    # Declared now, operative from the I4 command endpoints (ARCH-001 §4,
    # ADR-011): I1b declares no write operation, so no operation references
    # these two yet.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated idempotency key of a command (concept ch. 10.1).
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected optimistic-lock version of the resource, for conditional writes (concept ch. 10.1).
      schema:
        type: string
