# RiskSignal — local development environment (WP-1a.03, implementation
# concept §4.2 "Lokale Umgebung").
#
# Published ports bind 127.0.0.1 (loopback) only; the environment is never
# reachable from other hosts. Host port numbers default to the values below
# and can be overridden when a port is already taken on the developer
# machine, e.g.  COMPOSE_OIDC_PORT=19000 make up
#
#   db    127.0.0.1:5432   PostgreSQL 16 (named volume pgdata)
#   mail  127.0.0.1:1025   Mailpit SMTP
#   mail  127.0.0.1:8025   Mailpit UI/API
#   oidc  127.0.0.1:9000   mock OIDC provider (cmd/mock-oidc)
#
# server has served HTTP through the WP-1a.06 middleware chain since WP-1a.06
# and answers the WP-1a.07 System endpoints (/health/live, /health/ready,
# /version) since WP-1a.07 (it binds its loopback default, 127.0.0.1:8080,
# inside the container; no host port is published). The worker has run its
# WP-1a.10 scheduler loop — heartbeat and one scheduler run per
# worker.interval (default 30s) — since WP-1a.10.
# db, mail and oidc are the services that must stay up.

name: risksignal

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: risksignal
      POSTGRES_PASSWORD: risksignal
      POSTGRES_DB: risksignal
    ports:
      - "127.0.0.1:${COMPOSE_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risksignal -d risksignal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mail:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${COMPOSE_MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${COMPOSE_MAIL_UI_PORT:-8025}:8025"

  oidc:
    build:
      context: .
      dockerfile: deploy/mock-oidc/Containerfile
    ports:
      - "127.0.0.1:${COMPOSE_OIDC_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/oidc/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: deploy/server/Containerfile
    environment:
      # Valid local configuration so the WP-1a.02 startup validation passes
      # (the skeleton exits 0; it does not connect yet — WP-1a.05).
      RISKSIGNAL_DATABASE_URL: "postgres://risksignal:risksignal@db:5432/risksignal?sslmode=disable"
      RISKSIGNAL_OIDC_ISSUER: "http://oidc:9000/oidc"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/worker/Containerfile
    environment:
      RISKSIGNAL_DATABASE_URL: "postgres://risksignal:risksignal@db:5432/risksignal?sslmode=disable"
      RISKSIGNAL_OIDC_ISSUER: "http://oidc:9000/oidc"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
