# RiskSignal — CI pipeline (WP-1a.12 stages 1–3, WP-1a.13 stages 4–6;
# implementation concept ch. 17.1/17.3, D-002 GitHub Actions, D-005
# quality/security toolchain).
#
# Stage layout (concept ch. 17.3):
#   lint  — gofmt check, go vet, static analysis incl. gosec (golangci-lint),
#           architecture gate (go-arch-lint, WP-1a.11), licence check
#           (go-licenses), secret scan (gitleaks), then the ADR-011 OpenAPI
#           gates of WP-1b.11: gate 1 (validate the document against the
#           3.1 spec through the kin-openapi validation of the contract
#           suite — the CI no-Node equivalent of the redocly
#           `make validate-openapi` gate; CI installs no Node toolchain)
#           and gate 2 (regenerate sqlc + oapi-codegen output and fail on a
#           diff, ADR-009/ADR-011, TAT-13)
#   test  — race-enabled unit and integration tests against a short-lived,
#           real PostgreSQL 16 service container (concept ch. 17.1:
#           integration tests run against a real, short-lived instance);
#           includes the ADR-011 gate-3 contract suite, whose document
#           validation doubles as the gate-1 check inside the suite
#   build — `make build`: the three binaries with build metadata
#   image — stages 4–6 (WP-1a.13, runs after lint/test/build): production
#           container images with the WP-1a.07 build metadata (`make image`),
#           SBOMs (`make sbom`: cyclonedx-gomod module SBOM + syft image
#           SBOMs), vulnerability scans (`make scan`: govulncheck, then grype
#           --fail-on high on both images) and the cosign keyless signing
#           skeleton (`make sign` — signs nothing)
#
# The pipeline is deterministic: every tool is pinned to the exact version
# recorded in docs/plan/orchestrator-decisions.md (D-005) and each job
# mirrors the local make target of the same stage (`make ci-lint` /
# `make ci-test` / `make ci-build` / `make image` / `make sbom` /
# `make scan` / `make sign`), so a failure reproduces without GitHub.
#
# Notes:
# - The repository has no remote yet: this workflow stays inert until the
#   first push to GitHub, and the image job additionally has no registry to
#   push to — the images stay on the runner, SBOMs and scan reports are
#   uploaded as workflow artifacts. Pushing and real (keyless) signing are
#   release-stage work; the intended flow is recorded in
#   docs/plan/release-signing.md.
# - actions/checkout, actions/setup-go and actions/upload-artifact are pinned
#   by tag, not SHA; SHA-pinning the marketplace actions is deferred to the
#   release hardening (I6). The image job deliberately does not grant
#   id-token: write — keyless signing would need it at release time only.
# - gitleaks scans the full git history of the pushed ref; the only
#   allowlist entry is the synthetic redaction fixture
#   (internal/platform/logging/redact_test.go, see .gitleaks.toml).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (stage 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: static analysis incl. gosec (golangci-lint)
        env:
          GOLANGCI_LINT_VERSION: v2.13.2
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          "$(go env GOPATH)/bin/golangci-lint" run
      - name: architecture gate (go-arch-lint, WP-1a.11)
        env:
          GO_ARCH_LINT_VERSION: v1.19.0
        run: |
          go install github.com/fe3dback/go-arch-lint@${GO_ARCH_LINT_VERSION}
          "$(go env GOPATH)/bin/go-arch-lint" check
      - name: licence check (go-licenses)
        env:
          GO_LICENSES_VERSION: v1.6.0
        run: |
          go install github.com/google/go-licenses@${GO_LICENSES_VERSION}
          "$(go env GOPATH)/bin/go-licenses" check --ignore github.com/xpera/risksignal ./...
      - name: secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          go install github.com/gitleaks/gitleaks/v8@${GITLEAKS_VERSION}
          "$(go env GOPATH)/bin/gitleaks" detect --source .
      - name: OpenAPI validate — ADR-011 gate 1 (WP-1b.11)
        # The kin-openapi validation of the contract suite, run standalone
        # without a database: the no-Node CI equivalent of the redocly
        # `make validate-openapi` gate, which needs Node via npx and stays
        # the local developer validator. Mirrors `make lint-openapi-validate`
        # (and `make ci-lint`).
        run: go test ./cmd/risksignal-server -run '^TestOpenAPIDocumentValidatesAgainst31$' -count=1
      - name: regenerate and diff generated code — ADR-011 gate 2 (WP-1b.11)
        # Regenerate the committed sqlc (ADR-009) and oapi-codegen (ADR-011)
        # output and fail on any divergence: a hand-edited generated file or
        # a schema change without regeneration breaks the build (TAT-13).
        # Mirrors `make lint-openapi-diff` (and `make ci-lint`).
        env:
          SQLC_VERSION: v1.31.1
          OAPI_CODEGEN_VERSION: v2.8.0
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${OAPI_CODEGEN_VERSION}
          make generate
          git diff --exit-code -- internal/adapters/httpapi/gen internal/adapters/postgres/gen

  test:
    name: test (stage 2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: risksignal
          POSTGRES_PASSWORD: risksignal
          POSTGRES_DB: risksignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risksignal -d risksignal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: race-enabled test suite
        env:
          RISKSIGNAL_TEST_DATABASE_URL: postgres://risksignal:risksignal@localhost:5432/risksignal?sslmode=disable
        run: go test -race ./...

  build:
    name: build (stage 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the three binaries
        run: make build

  image:
    name: image, sbom and scans (stages 4-6, WP-1a.13)
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install SBOM, scan and signing tooling (pinned, D-005)
        env:
          CYCLONEDX_GOMOD_VERSION: v1.12.0
          GOVULNCHECK_VERSION: v1.8.0
          SYFT_VERSION: 1.51.1
          GRYPE_VERSION: 0.118.0
          COSIGN_VERSION: v2.6.5
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/sigstore/cosign/v2/cmd/cosign@${COSIGN_VERSION}
          gobin="$(go env GOPATH)/bin"
          # syft/grype: checksum-verified GitHub release binaries — a `go
          # install` build of the anchore tools does not stamp the version.
          curl -fsSL -o /tmp/syft_${SYFT_VERSION}_linux_amd64.tar.gz https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz
          curl -fsSL -o /tmp/syft_${SYFT_VERSION}_checksums.txt https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt
          (cd /tmp && grep " syft_${SYFT_VERSION}_linux_amd64.tar.gz$" syft_${SYFT_VERSION}_checksums.txt | sha256sum -c -)
          tar -xzf /tmp/syft_${SYFT_VERSION}_linux_amd64.tar.gz -C "${gobin}" syft
          curl -fsSL -o /tmp/grype_${GRYPE_VERSION}_linux_amd64.tar.gz https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz
          curl -fsSL -o /tmp/grype_${GRYPE_VERSION}_checksums.txt https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt
          (cd /tmp && grep " grype_${GRYPE_VERSION}_linux_amd64.tar.gz$" grype_${GRYPE_VERSION}_checksums.txt | sha256sum -c -)
          tar -xzf /tmp/grype_${GRYPE_VERSION}_linux_amd64.tar.gz -C "${gobin}" grype
          echo "${gobin}" >> "${GITHUB_PATH}"
      - name: build the production images (stage 4)
        run: make image
      - name: generate SBOMs (stage 5a)
        run: make sbom
      - name: vulnerability scans (stage 5b)
        run: make scan
      - name: cosign keyless signing skeleton (stage 6, signs nothing)
        run: make sign
      - name: upload SBOMs and scan reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-scan-reports
          path: |
            dist/sbom/
            dist/scan/
          if-no-files-found: error
